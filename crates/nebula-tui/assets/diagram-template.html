<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="nebula-diagram" content='{{META}}'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Nebula diagram "{{SLUG}}" — rules:
  - one self-contained file: no CDN, no network (the viewer blocks it anyway);
  - colours only through the variables below, never hardcoded;
  - keep the <title>: the viewer lists and searches diagrams by it.
  Draw with plain HTML/CSS and inline <svg>. The viewer is ~1200×800 and
  scrolls; clicks, wheel and keys reach this page.
-->
<style>
  :root {
    --bg: #0d1118;
    --surface: #151b26;
    --surface-2: #1c2433;
    --edge: #2a3345;
    --text: #d7dce6;
    --muted: #8b94a7;
    --accent: #baaaeb;
    --ok: #7fd1a0;
    --warn: #e6c274;
    --err: #ec8a8a;
    --info: #7db7ee;
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 32px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); font-weight: 600; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .card { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--radius); padding: 16px 18px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  svg { display: block; width: 100%; height: auto; }
  svg .node rect { fill: var(--surface-2); stroke: var(--edge); stroke-width: 1.5; rx: 8; }
  svg .node.accent rect { stroke: var(--accent); }
  svg .node text { fill: var(--text); font: 14px var(--font); text-anchor: middle; dominant-baseline: central; }
  svg .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  svg .label { fill: var(--muted); font: 12px var(--font); text-anchor: middle; }
</style>
</head>
<body>
<main>
  <h1>{{TITLE}}</h1>
  <p class="lede">Replace this with one sentence saying what the diagram shows.</p>

  <div class="card">
    <svg viewBox="0 0 760 200" role="img" aria-label="{{TITLE}}">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
        </marker>
      </defs>
      <g class="node accent"><rect x="20" y="70" width="180" height="60"/><text x="110" y="100">Client</text></g>
      <g class="node"><rect x="290" y="70" width="180" height="60"/><text x="380" y="100">Service</text></g>
      <g class="node"><rect x="560" y="70" width="180" height="60"/><text x="650" y="100">Store</text></g>
      <path class="edge" d="M200 100 H288"/><text class="label" x="245" y="90">request</text>
      <path class="edge" d="M470 100 H558"/><text class="label" x="515" y="90">query</text>
    </svg>
  </div>
</main>
</body>
</html>
